name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-windows:
    name: Full Verify (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify pure 7-bit ASCII source files
        run: |
          $ErrorActionPreference = 'Stop'
          $nonAscii = @()
          Get-ChildItem -Recurse -File -Include *.rs,*.ts,*.tsx,*.js,*.jsx,*.mjs,*.py,*.ps1,*.yml,*.yaml | Where-Object {
            $_.FullName -notmatch '\\(target|node_modules|dist|\.git)\\'
          } | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            if ($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1) {
              $nonAscii += $_.FullName
            }
          }
          if ($nonAscii.Count -gt 0) {
            throw ("Non-ASCII characters found in: " + ($nonAscii -join ", "))
          }
          Write-Host "OK: all source files are pure 7-bit ASCII"

      - name: Verify tracked CoreView and locale key parity
        run: |
          $ErrorActionPreference = 'Stop'
          git ls-files --error-unmatch src/features/core/CoreView.tsx | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "src/features/core/CoreView.tsx is not tracked by git; check anchored /core/ rule in .gitignore"
          }
          Write-Host "OK: src/features/core/CoreView.tsx is tracked"

          $checkScript = @'
          const fs = require("fs");
          function flatten(obj, prefix = "") {
            const out = new Set();
            for (const [k, v] of Object.entries(obj)) {
              const key = prefix ? `${prefix}.${k}` : k;
              if (v && typeof v === "object" && !Array.isArray(v)) {
                for (const sub of flatten(v, key)) out.add(sub);
              } else {
                out.add(key);
              }
            }
            return out;
          }
          const en = flatten(JSON.parse(fs.readFileSync("src/locales/en.json", "utf8")));
          const zh = flatten(JSON.parse(fs.readFileSync("src/locales/zh-CN.json", "utf8")));
          const missingInZh = [...en].filter((k) => !zh.has(k));
          const extraInZh = [...zh].filter((k) => !en.has(k));
          if (missingInZh.length > 0 || extraInZh.length > 0) {
            console.error("Locale parity mismatch:", { missingInZh, extraInZh });
            process.exit(1);
          }
          console.log(`OK: locale key parity verified (${en.size} keys)`);
          '@
          node -e $checkScript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: TypeScript typecheck
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend unit tests
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build frontend bundle
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust Clippy (deny warnings)
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust workspace tests
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  verify-unix:
    name: Workspace Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build frontend bundle for Tauri context
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Rust Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust workspace tests
        run: cargo test --workspace
