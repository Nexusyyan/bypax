name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0; defaults to v<version> from Cargo.toml)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APP_DISPLAY_NAME: 'Bypax'
  APP_BIN_NAME: 'bypax'
  SINGBOX_VERSION: 'v1.14.4'

jobs:
  prepare:
    name: Resolve Tag & Verify Version Alignment
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag and check manifest alignment
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          CARGO_VER=$(awk '/^\[workspace\.package\]/{f=1;next}/^\[/{f=0} f && /^version[[:space:]]*=/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          PKG_VER=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)')
          TAURI_VER=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json","utf8")).version)')

          if [ -z "$CARGO_VER" ] || [ "$CARGO_VER" != "$PKG_VER" ] || [ "$CARGO_VER" != "$TAURI_VER" ]; then
            echo "Version mismatch: Cargo.toml=$CARGO_VER package.json=$PKG_VER tauri.conf.json=$TAURI_VER" >&2
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "${INPUT_TAG:-}" ]; then
            TAG="$(printf '%s' "$INPUT_TAG" | tr -d '[:space:]')"
          else
            TAG="v${CARGO_VER}"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "Invalid release tag '$TAG'. Expected format like v0.1.0" >&2
            exit 1
          fi

          TAG_BASE="${TAG#v}"
          TAG_BASE="${TAG_BASE%%-*}"
          if [ "$TAG_BASE" != "$CARGO_VER" ]; then
            echo "Release tag base '$TAG_BASE' does not match Cargo.toml version '$CARGO_VER'" >&2
            exit 1
          fi

          echo "Resolved release tag: $TAG (manifests aligned at $CARGO_VER)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows x64 Bundles
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run quality gates
        run: |
          $ErrorActionPreference = 'Stop'
          $nonAscii = @()
          Get-ChildItem -Recurse -File -Include *.rs,*.ts,*.tsx,*.js,*.jsx,*.mjs,*.py,*.ps1,*.yml,*.yaml | Where-Object {
            $_.FullName -notmatch '\\(target|node_modules|dist|\.git)\\'
          } | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            if ($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1) {
              $nonAscii += $_.FullName
            }
          }
          if ($nonAscii.Count -gt 0) {
            throw ("Non-ASCII characters found in: " + ($nonAscii -join ", "))
          }

          git ls-files --error-unmatch src/features/core/CoreView.tsx | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "src/features/core/CoreView.tsx is not tracked by git" }

          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows release binaries (GUI, CLI, Service)
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release -p bypax-cli -p bypax-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pnpm tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($exe in @('target/release/bypax.exe', 'target/release/bypax-cli.exe', 'target/release/bypax-service.exe')) {
            if (-not (Test-Path $exe)) {
              throw "Expected release binary was not produced: $exe"
            }
          }

      - name: Stage Windows portable, nodriver, and standalone artifacts
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $bin = $env:APP_BIN_NAME
          $outDir = 'release-artifacts'
          $stageRoot = 'release-stage'
          $runtimeDir = Join-Path $stageRoot 'runtimes'
          $fullStage = Join-Path $stageRoot 'full'
          $nodriverStage = Join-Path $stageRoot 'nodriver'

          Remove-Item -Recurse -Force $outDir, $stageRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $outDir, $runtimeDir, $fullStage, $nodriverStage | Out-Null

          $coreCache = Join-Path $runtimeDir 'core'
          $wdCache = Join-Path $runtimeDir 'windivert'

          # Fetch verified official unmodified sing-box v1.14.4 and signed WinDivert 2.2.2-A
          pwsh -NoProfile -File 'scripts/fetch-core.ps1' -OutDir $coreCache -Version $env:SINGBOX_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoProfile -File 'scripts/fetch-windivert.ps1' -OutputDir $wdCache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $skillSrc = 'skills/bypax-agent/SKILL.md'
          if (-not (Test-Path $skillSrc)) {
            throw "Required agent skill file not found: $skillSrc"
          }

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          foreach ($stage in @($fullStage, $nodriverStage)) {
            $stageCore = Join-Path $stage 'core'
            $stageSkills = Join-Path $stage 'skills/bypax-agent'
            New-Item -ItemType Directory -Force -Path $stageCore, $stageSkills | Out-Null

            Copy-Item 'target/release/bypax.exe' (Join-Path $stage 'bypax.exe')
            Copy-Item 'target/release/bypax-cli.exe' (Join-Path $stage 'bypax-cli.exe')
            Copy-Item 'target/release/bypax-service.exe' (Join-Path $stage 'bypax-service.exe')
            Copy-Item (Join-Path $coreCache 'sing-box.exe') (Join-Path $stageCore 'sing-box.exe')
            Copy-Item $skillSrc (Join-Path $stageSkills 'SKILL.md')

            foreach ($doc in @('LICENSE', 'THIRD_PARTY_NOTICES.md', 'README.md', 'README.zh-CN.md')) {
              if (Test-Path $doc) {
                Copy-Item $doc (Join-Path $stage $doc)
              }
            }

            [System.IO.File]::WriteAllText(
              (Join-Path (Resolve-Path $stage).Path 'portable.json'),
              "{`"portable`":true}`n",
              $utf8NoBom
            )
          }

          # Full portable bundle includes ONLY WinDivert.dll, WinDivert64.sys, and notices (zero sample tools)
          $fullWd = Join-Path $fullStage 'runtime/windivert'
          New-Item -ItemType Directory -Force -Path $fullWd | Out-Null
          foreach ($wdFile in @('WinDivert.dll', 'WinDivert64.sys', 'WINDIVERT_LICENSE.txt', 'WINDIVERT_README.txt')) {
            $src = Join-Path $wdCache $wdFile
            if (-not (Test-Path $src)) {
              throw "Missing required WinDivert runtime file: $src"
            }
            Copy-Item $src (Join-Path $fullWd $wdFile)
          }

          # No-driver bundle includes scripts/fetch-windivert.ps1 for strict antivirus environments
          $nodriverScripts = Join-Path $nodriverStage 'scripts'
          New-Item -ItemType Directory -Force -Path $nodriverScripts | Out-Null
          Copy-Item 'scripts/fetch-windivert.ps1' (Join-Path $nodriverScripts 'fetch-windivert.ps1')

          $portableZipName = "$bin-$tag-x86_64-windows-portable.zip"
          $nodriverZipName = "$bin-$tag-x86_64-windows-nodriver.zip"
          $standaloneName = "$bin-$tag-x86_64-windows.exe"

          Compress-Archive -Path (Join-Path $fullStage '*') -DestinationPath (Join-Path $outDir $portableZipName) -CompressionLevel Optimal -Force
          Compress-Archive -Path (Join-Path $nodriverStage '*') -DestinationPath (Join-Path $outDir $nodriverZipName) -CompressionLevel Optimal -Force
          Copy-Item 'target/release/bypax.exe' (Join-Path $outDir $standaloneName)

          Get-ChildItem $outDir | Sort-Object Name | ForEach-Object {
            Write-Host ("Windows artifact: {0} ({1:N2} MB)" -f $_.Name, ($_.Length / 1MB))
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bypax-${{ needs.prepare.outputs.tag }}-x86_64-windows
          path: |
            release-artifacts/*.zip
            release-artifacts/*.exe

  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    needs: prepare
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            rust_target: aarch64-apple-darwin
            singbox_arch: darwin-arm64
            singbox_sha256: 0d8c7f5ed5d587b0f1a5e9772a708ec3bfa4ac4c9329604b01d8d9c2ba406838
          - arch: x86_64
            rust_target: x86_64-apple-darwin
            singbox_arch: darwin-amd64
            singbox_sha256: eae86b9b033bba50b7c44ab719e4bfac0aca05efd28483390ed3aa510f32db25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      - name: Build frontend and verify workspace
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          cargo clippy --workspace --all-targets --target "${{ matrix.rust_target }}" -- -D warnings

      - name: Run native macOS workspace tests
        if: matrix.arch == 'aarch64'
        run: cargo test --workspace

      - name: Build macOS binaries and Bypax.app bundle
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.rust_target }}" -p bypax-cli -p bypax-service
          pnpm tauri build --target "${{ matrix.rust_target }}" --bundles app

      - name: Bundle companion binaries, official sing-box, ad-hoc sign, and build DMG
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
          SINGBOX_ARCH: ${{ matrix.singbox_arch }}
          SINGBOX_SHA256: ${{ matrix.singbox_sha256 }}
        run: |
          set -euo pipefail
          APP_SRC="target/${RUST_TARGET}/release/bundle/macos/Bypax.app"
          CLI_SRC="target/${RUST_TARGET}/release/bypax-cli"
          SVC_SRC="target/${RUST_TARGET}/release/bypax-service"
          SKILL_SRC="skills/bypax-agent/SKILL.md"

          test -d "$APP_SRC"
          test -f "$APP_SRC/Contents/Resources/icon.icns"
          test -f "$CLI_SRC"
          test -f "$SVC_SRC"
          test -f "$SKILL_SRC"

          # Download and SHA-256 verify official unmodified arch-matched sing-box
          VER_NUM="${SINGBOX_VERSION#v}"
          SB_TAR="sing-box-${VER_NUM}-${SINGBOX_ARCH}.tar.gz"
          SB_URL="https://github.com/SagerNet/sing-box/releases/download/${SINGBOX_VERSION}/${SB_TAR}"
          TMP_SB="$(mktemp -d)"
          trap 'rm -rf "$TMP_SB"' EXIT

          curl -fSL --retry 3 --retry-delay 3 -o "$TMP_SB/$SB_TAR" "$SB_URL"
          GOT_SHA="$(shasum -a 256 "$TMP_SB/$SB_TAR" | awk '{print $1}')"
          if [ "$GOT_SHA" != "$SINGBOX_SHA256" ]; then
            echo "sing-box SHA-256 mismatch: expected $SINGBOX_SHA256, got $GOT_SHA" >&2
            exit 1
          fi

          tar -xzf "$TMP_SB/$SB_TAR" -C "$TMP_SB"
          SB_BIN="$(find "$TMP_SB" -type f -name 'sing-box' | head -n 1)"
          test -n "$SB_BIN"

          rm -rf release-stage release-artifacts
          mkdir -p release-stage/dmg release-artifacts
          APP_DST="release-stage/dmg/Bypax.app"
          cp -R "$APP_SRC" "$APP_DST"

          # Embed companion binaries, official core, agent skill, and notices inside Bypax.app
          mkdir -p "$APP_DST/Contents/MacOS/core" "$APP_DST/Contents/Resources/skills/bypax-agent"
          cp "$CLI_SRC" "$APP_DST/Contents/MacOS/bypax-cli"
          cp "$SVC_SRC" "$APP_DST/Contents/MacOS/bypax-service"
          cp "$SB_BIN" "$APP_DST/Contents/MacOS/core/sing-box"
          chmod 755 "$APP_DST/Contents/MacOS/bypax-cli" "$APP_DST/Contents/MacOS/bypax-service" "$APP_DST/Contents/MacOS/core/sing-box"
          cp "$SKILL_SRC" "$APP_DST/Contents/Resources/skills/bypax-agent/SKILL.md"
          cp LICENSE THIRD_PARTY_NOTICES.md "$APP_DST/Contents/Resources/"

          # Ad-hoc codesign nested executables first, then deep-sign and strictly verify Bypax.app
          codesign --force --sign - "$APP_DST/Contents/MacOS/bypax-cli"
          codesign --force --sign - "$APP_DST/Contents/MacOS/bypax-service"
          codesign --force --sign - "$APP_DST/Contents/MacOS/core/sing-box"
          codesign --force --deep --sign - "$APP_DST"
          codesign --verify --deep --strict --verbose=2 "$APP_DST"

          # Populate DMG root with Applications link, notices, and agent skill
          ln -s /Applications release-stage/dmg/Applications
          mkdir -p release-stage/dmg/skills/bypax-agent
          cp "$SKILL_SRC" release-stage/dmg/skills/bypax-agent/SKILL.md
          cp LICENSE THIRD_PARTY_NOTICES.md release-stage/dmg/

          DMG_NAME="bypax-${RELEASE_TAG}-${ARCH}-macos.dmg"
          hdiutil create \
            -volname "Bypax ${RELEASE_TAG}" \
            -srcfolder release-stage/dmg \
            -ov \
            -format UDZO \
            "release-artifacts/${DMG_NAME}"

          ls -lh "release-artifacts/${DMG_NAME}"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bypax-${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}-macos
          path: release-artifacts/*.dmg

  publish:
    name: Generate SHA256SUMS & Publish GitHub Release
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Verify expected artifacts and generate SHA256SUMS.txt
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          EXPECTED=(
            "bypax-${TAG}-x86_64-windows-portable.zip"
            "bypax-${TAG}-x86_64-windows-nodriver.zip"
            "bypax-${TAG}-x86_64-windows.exe"
            "bypax-${TAG}-aarch64-macos.dmg"
            "bypax-${TAG}-x86_64-macos.dmg"
          )

          for f in "${EXPECTED[@]}"; do
            if [ ! -f "release-artifacts/$f" ]; then
              echo "Missing expected release artifact: $f" >&2
              exit 1
            fi
          done

          (
            cd release-artifacts
            LC_ALL=C sha256sum "${EXPECTED[@]}" | sort -k2 > SHA256SUMS.txt
          )

          cat release-artifacts/SHA256SUMS.txt

      - name: Upload SHA256SUMS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bypax-${{ needs.prepare.outputs.tag }}-checksums
          path: release-artifacts/SHA256SUMS.txt

      - name: Publish idempotent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"

          WIN_PORTABLE="bypax-${TAG}-x86_64-windows-portable.zip"
          WIN_NODRIVER="bypax-${TAG}-x86_64-windows-nodriver.zip"
          WIN_EXE="bypax-${TAG}-x86_64-windows.exe"
          MAC_ARM="bypax-${TAG}-aarch64-macos.dmg"
          MAC_X64="bypax-${TAG}-x86_64-macos.dmg"

          hash_of() {
            awk -v name="$1" '$2 == name { print $1 }' release-artifacts/SHA256SUMS.txt
          }

          H_WIN_PORTABLE="$(hash_of "$WIN_PORTABLE")"
          H_WIN_NODRIVER="$(hash_of "$WIN_NODRIVER")"
          H_WIN_EXE="$(hash_of "$WIN_EXE")"
          H_MAC_ARM="$(hash_of "$MAC_ARM")"
          H_MAC_X64="$(hash_of "$MAC_X64")"

          cat > release-notes.tpl.md <<'EOF'
          ### Downloads

          | Package | Platform | Description | SHA-256 |
          | --- | --- | --- | --- |
          | `__WIN_PORTABLE__` | Windows x64 | **Recommended Portable Bundle**: `bypax.exe`, `bypax-cli.exe`, `bypax-service.exe`, verified official `core/sing-box.exe`, verified signed `runtime/windivert/*` (zero sample tools), `skills/bypax-agent/SKILL.md`, `portable.json`, and notices. | `__H_WIN_PORTABLE__` |
          | `__WIN_NODRIVER__` | Windows x64 | **Clean No-Driver Portable Bundle**: everything above except WinDivert driver files; includes `scripts/fetch-windivert.ps1` for strict antivirus environments. | `__H_WIN_NODRIVER__` |
          | `__WIN_EXE__` | Windows x64 | **Standalone GUI Executable**: single-file GUI without bundled runtime binaries. | `__H_WIN_EXE__` |
          | `__MAC_ARM__` | macOS Apple Silicon | **macOS arm64 DMG** (ad-hoc signed): bundles `Bypax.app`, `bypax-cli`, `bypax-service`, official arm64 `sing-box`, and `skills/bypax-agent/SKILL.md`. | `__H_MAC_ARM__` |
          | `__MAC_X64__` | macOS Intel | **macOS x86_64 DMG** (ad-hoc signed): bundles `Bypax.app`, `bypax-cli`, `bypax-service`, official amd64 `sing-box`, and `skills/bypax-agent/SKILL.md`. | `__H_MAC_X64__` |

          ### Quick Start

          - **Windows**: Extract `__WIN_PORTABLE__` and launch `bypax.exe` (non-elevated). All portable data stays in `./bypax-data/`. Enable per-app Zero-TUN routing via WinDivert in **Apps** (Background Service or On-Demand UAC).
          - **macOS (Zero-Cert Community Build)**: Drag `Bypax.app` into `/Applications`. Because Bypax is ad-hoc signed without a paid Apple Developer certificate, clear Gatekeeper quarantine once before first launch:
            ```bash
            xattr -dr com.apple.quarantine /Applications/Bypax.app
            ```
            macOS App Proxy uses **zero-cert `launchd` (`com.bypax.service`) + `utun` path routing** so unselected applications remain direct and RFC1918 / Tailscale / OrbStack subnets are bypassed cleanly.
          - **AI Agent CLI & MCP**: Connect Antigravity, Claude Code, or Cursor to `bypax-cli mcp` (20-tool Stdio MCP server) or call `bypax-cli ctl --json ...`. See `skills/bypax-agent/SKILL.md`.

          > Built transparently from source via GitHub Actions (`windows-latest` and `macos-latest`). Verify every download against `SHA256SUMS.txt`.
          EOF

          WIN_PORTABLE="$WIN_PORTABLE" \
          WIN_NODRIVER="$WIN_NODRIVER" \
          WIN_EXE="$WIN_EXE" \
          MAC_ARM="$MAC_ARM" \
          MAC_X64="$MAC_X64" \
          H_WIN_PORTABLE="$H_WIN_PORTABLE" \
          H_WIN_NODRIVER="$H_WIN_NODRIVER" \
          H_WIN_EXE="$H_WIN_EXE" \
          H_MAC_ARM="$H_MAC_ARM" \
          H_MAC_X64="$H_MAC_X64" \
          node -e '
            const fs = require("fs");
            let text = fs.readFileSync("release-notes.tpl.md", "utf8");
            const vars = [
              "WIN_PORTABLE", "WIN_NODRIVER", "WIN_EXE", "MAC_ARM", "MAC_X64",
              "H_WIN_PORTABLE", "H_WIN_NODRIVER", "H_WIN_EXE", "H_MAC_ARM", "H_MAC_X64"
            ];
            for (const key of vars) {
              text = text.split(`__${key}__`).join(process.env[key] || "");
            }
            fs.writeFileSync("release-notes.md", text, "utf8");
          '

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading updated assets..."
            gh release upload "$TAG" release-artifacts/* --clobber
            gh release edit "$TAG" --title "${APP_DISPLAY_NAME} ${TAG}" --notes-file release-notes.md
          else
            echo "Creating GitHub Release $TAG..."
            ARGS=(
              release create "$TAG"
              release-artifacts/*
              --title "${APP_DISPLAY_NAME} ${TAG}"
              --notes-file release-notes.md
              --generate-notes
              --target "$GITHUB_SHA"
            )
            if [[ "$TAG" == *-* ]]; then
              ARGS+=(--prerelease)
            fi
            gh "${ARGS[@]}"
          fi
